<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 800"
     width="800"
     height="800">

  <defs>

    <!-- ================= BACKGROUND ================= -->

    <radialGradient id="background"
                    cx="50%"
                    cy="42%"
                    r="70%">

      <stop offset="0%"
            stop-color="#142957"/>

      <stop offset="55%"
            stop-color="#071127"/>

      <stop offset="100%"
            stop-color="#02040b"/>
    </radialGradient>


    <!-- ================= RING GRADIENT ================= -->

    <linearGradient id="ringGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#00D9FF"/>

      <stop offset="35%"
            stop-color="#2F8CFF"/>

      <stop offset="65%"
            stop-color="#6366F1"/>

      <stop offset="100%"
            stop-color="#A855F7"/>
    </linearGradient>


    <!-- ================= S GRADIENT ================= -->

    <linearGradient id="sGradient"
                    x1="10%"
                    y1="0%"
                    x2="90%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#FFFFFF"/>

      <stop offset="40%"
            stop-color="#E8F5FF"/>

      <stop offset="75%"
            stop-color="#7CCBFF"/>

      <stop offset="100%"
            stop-color="#3B82F6"/>
    </linearGradient>


    <!-- ================= A GRADIENT ================= -->

    <linearGradient id="aGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#4DE5FF"/>

      <stop offset="35%"
            stop-color="#3B82F6"/>

      <stop offset="70%"
            stop-color="#6366F1"/>

      <stop offset="100%"
            stop-color="#A855F7"/>
    </linearGradient>


    <!-- ================= TEXT GRADIENT ================= -->

    <linearGradient id="textGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            stop-color="#67E8F9"/>

      <stop offset="50%"
            stop-color="#FFFFFF"/>

      <stop offset="100%"
            stop-color="#C084FC"/>
    </linearGradient>


    <!-- ================= GLOW ================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="12"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================= SMALL GLOW ================= -->

    <filter id="smallGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="4"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!--                    BACKGROUND                     -->
  <!-- ================================================= -->

  <circle
    cx="400"
    cy="400"
    r="380"
    fill="url(#background)"
  />


  <!-- ================================================= -->
  <!--                 OUTER GLOW RING                   -->
  <!-- ================================================= -->

  <circle
    cx="400"
    cy="400"
    r="340"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="22"
    opacity="0.25"
    filter="url(#glow)"
  />


  <!-- ================================================= -->
  <!--                   MAIN RING                       -->
  <!-- ================================================= -->

  <circle
    cx="400"
    cy="400"
    r="340"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="8"
  />


  <!-- ================================================= -->
  <!--                 INNER RING                        -->
  <!-- ================================================= -->

  <circle
    cx="400"
    cy="400"
    r="328"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity="0.12"
  />


  <!-- ================================================= -->
  <!--                  SA MONOGRAM                      -->
  <!-- ================================================= -->


  <!-- S -->

  <path
    d="
      M 485 190
      H 300

      C 245 190
        205 220
        205 267

      C 205 316
        241 338
        291 349

      L 408 375

      C 427 379
        438 388
        438 401

      C 438 416
        423 426
        400 426

      H 220

      L 190 475

      H 407

      C 463 475
        500 443
        500 397

      C 500 349
        465 325
        416 314

      L 299 288

      C 277 283
        266 274
        266 260

      C 266 245
        281 235
        303 235

      H 456

      Z
    "

    fill="url(#sGradient)"
    filter="url(#smallGlow)"
  />


  <!-- A -->

  <path
    d="
      M 410 475

      L 520 190

      L 605 475

      H 543

      L 525 414

      H 449

      L 429 475

      Z

      M 468 362

      H 510

      L 489 286

      Z
    "

    fill="url(#aGradient)"
    filter="url(#smallGlow)"
  />


  <!-- ================================================= -->
  <!--                NAME                               -->
  <!-- ================================================= -->

  <text
    x="400"
    y="550"

    text-anchor="middle"

    font-family="Arial, Helvetica, sans-serif"

    font-size="43"

    font-weight="600"

    letter-spacing="10"

    fill="url(#textGradient)">

    SHAQUIB ANSARI

  </text>


  <!-- ================================================= -->
  <!--                DEVELOPER                          -->
  <!-- ================================================= -->

  <text
    x="400"
    y="600"

    text-anchor="middle"

    font-family="Arial, Helvetica, sans-serif"

    font-size="25"

    font-weight="500"

    letter-spacing="13"

    fill="#B8C7E6">

    DEVELOPER

  </text>


  <!-- ================================================= -->
  <!--                LEFT LINE                          -->
  <!-- ================================================= -->

  <line
    x1="250"
    y1="655"
    x2="345"
    y2="655"

    stroke="url(#ringGradient)"

    stroke-width="4"

    stroke-linecap="round"

    filter="url(#smallGlow)"
  />


  <!-- ================================================= -->
  <!--                RIGHT LINE                         -->
  <!-- ================================================= -->

  <line
    x1="455"
    y1="655"
    x2="550"
    y2="655"

    stroke="url(#ringGradient)"

    stroke-width="4"

    stroke-linecap="round"

    filter="url(#smallGlow)"
  />


  <!-- ================================================= -->
  <!--                 CODE SYMBOL                       -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#smallGlow)">

    <!-- < -->

    <path
      d="M 375 625 L 345 655 L 375 685"
    />

    <!-- / -->

    <path
      d="M 405 620 L 390 690"
    />

    <!-- > -->

    <path
      d="M 425 625 L 455 655 L 425 685"
    />

  </g>


  <!-- ================================================= -->
  <!--             SMALL TOP HIGHLIGHT                  -->
  <!-- ================================================= -->

  <circle
    cx="400"
    cy="400"
    r="315"

    fill="none"

    stroke="#FFFFFF"

    stroke-width="1"

    opacity="0.07"
  />

</svg>